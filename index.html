<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажер рівнянь ULTRA CHILL</title>
    <style>
        :root {
            --bg-dark: #050714;
            --surface-card: rgba(15, 20, 38, 0.7);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.45);
            --accent-yellow: #f59e0b;
            --accent-yellow-glow: rgba(245, 158, 11, 0.45);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.45);
            --accent-purple: #a855f7;
            --accent-purple-glow: rgba(168, 85, 247, 0.5);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-blue-glow: rgba(59, 130, 246, 0.5);
        }

        body.neon-theme {
            --bg-dark: #0a0017;
            --surface-card: rgba(30, 0, 50, 0.6);
            --surface-border: rgba(236, 72, 153, 0.3);
            --accent-green: #00ffcc;
            --accent-green-glow: rgba(0, 255, 204, 0.6);
            --accent-purple: #ff007f;
            --accent-purple-glow: rgba(255, 0, 127, 0.6);
            --accent-cyan: #00e5ff;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            transition: background-color 0.4s ease;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
        }

        #particles-canvas, #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #particles-canvas { z-index: 0; }
        #confetti-canvas { z-index: 999; }

        .top-bar {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 6px 12px;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(12px);
        }

        .xp-bar-container {
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .xp-level-text {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .xp-progress-bg {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .xp-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transition: width 0.3s ease;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 50px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(0.95);
            overflow-y: auto;
            max-width: 480px;
            margin: 0 auto;
            right: 0;
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .tabs-container {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: rgba(168, 85, 247, 0.25);
            color: #e9d5ff;
            box-shadow: 0 0 15px var(--accent-purple-glow);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            backdrop-filter: blur(16px);
        }

        .formula-box {
            background: linear-gradient(135deg, rgba(20, 27, 47, 0.85) 0%, rgba(10, 15, 30, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 18px 14px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            word-break: break-word;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .ok-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 18px;
            padding: 14px 40px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            margin: auto auto 0 auto;
            cursor: pointer;
            display: block;
            box-shadow: 0 6px 20px var(--accent-green-glow);
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .answer-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            backdrop-filter: blur(16px);
            transition: all 0.2s ease;
        }

        .answer-card.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .answer-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(16, 185, 129, 0.18) !important;
            box-shadow: 0 0 18px var(--accent-green-glow) !important;
            color: #d1fae5;
            opacity: 1 !important;
        }

        .answer-card.wrong {
            border-color: var(--accent-red) !important;
            background: rgba(239, 68, 68, 0.18) !important;
            box-shadow: 0 0 18px var(--accent-red-glow) !important;
            color: #fee2e2;
            opacity: 1 !important;
        }

        .menu-card {
            position: relative;
            height: 100px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--surface-border);
            cursor: pointer;
            backdrop-filter: blur(12px);
        }

        .menu-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.35);
        }

        .menu-card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
        }

        .score-badge {
            font-size: 12px;
            font-weight: 800;
            display: none;
            background: rgba(5, 7, 20, 0.85);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 14px;
        }

        .card-title-text {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .border-green .card-title-text { color: #34d399; }
        .border-yellow .card-title-text { color: #fbbf24; }
        .border-red .card-title-text { color: #f87171; }
        .border-purple .card-title-text { color: #c084fc; }
        .border-blue .card-title-text { color: #60a5fa; }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }

        .reset-btn {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            margin-top: auto;
        }

        .act-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .act-current-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .streak-badge {
            margin-left: auto;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: none;
            box-shadow: 0 0 10px var(--accent-yellow-glow);
        }

        .notification {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 20, 38, 0.95);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 15px;
            z-index: 1000;
            transition: top 0.35s ease;
            backdrop-filter: blur(16px);
        }

        .notification.show { top: 20px; }
        .notification.success { border-color: var(--accent-green); color: #34d399; }
        .notification.error { border-color: var(--accent-red); color: #f87171; }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div id="toast-notification" class="notification"></div>

<div class="xp-bar-container">
    <div class="xp-level-text" id="level-display">LVL 1 (0 XP)</div>
    <div class="xp-progress-bg"><div class="xp-progress-fill" id="xp-fill"></div></div>
</div>

<div class="top-bar">
    <button class="control-btn" onclick="toggleTheme()">🎨</button>
    <button class="control-btn" id="sound-toggle-btn" onclick="toggleSound()">🔊</button>
</div>

<div id="screen-quiz" class="screen active">
    <div class="tabs-container">
        <button class="tab-btn" onclick="switchDemoChapter(1)">ГЛ. I</button>
        <button class="tab-btn" onclick="switchDemoChapter(2)">ГЛ. II</button>
        <button class="tab-btn" onclick="switchDemoChapter(3)">ГЛ. III</button>
        <button class="tab-btn" onclick="switchDemoChapter(4)">ГЛ. IV</button>
        <button class="tab-btn active" onclick="switchDemoChapter(5)">ГЛ. V</button>
    </div>

    <div class="formula-box" id="demo-formula">1.2(2X + 0.5) - 0.4 = 5.6</div>
    <div class="answers-grid" id="demo-answers-grid"></div>
    <button class="ok-btn" onclick="goToScreen('screen-chapters')">ЗРОЗУМІЛО (ОК)</button>
</div>

<div id="screen-chapters" class="screen">
    <div class="back-btn" onclick="goToScreen('screen-quiz')">←</div>

    <div class="menu-card border-green" onclick="openChapter(1)">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="1">
        <div class="menu-card-overlay">
            <div class="score-badge" id="chapter-score-1">0</div>
            <div class="card-title-text">ГЛАВА I</div>
            <div class="card-subtitle">Прості (1 дія)</div>
        </div>
    </div>

    <div class="menu-card border-yellow" onclick="openChapter(2)">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="2">
        <div class="menu-card-overlay">
            <div class="score-badge" id="chapter-score-2">0</div>
            <div class="card-title-text">ГЛАВА II</div>
            <div class="card-subtitle">Середні (2 дії)</div>
        </div>
    </div>

    <div class="menu-card border-red" onclick="openChapter(3)">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="3">
        <div class="menu-card-overlay">
            <div class="score-badge" id="chapter-score-3">0</div>
            <div class="card-title-text">ГЛАВА III</div>
            <div class="card-subtitle">Складні (3 дії)</div>
        </div>
    </div>

    <div class="menu-card border-purple" onclick="openChapter(4)">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80" alt="4">
        <div class="menu-card-overlay">
            <div class="score-badge" id="chapter-score-4">0</div>
            <div class="card-title-text">ГЛАВА IV</div>
            <div class="card-subtitle">УЛЬТРА ХАРДКОР</div>
        </div>
    </div>

    <div class="menu-card border-blue" onclick="openChapter(5)">
        <img src="https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=600&q=80" alt="5">
        <div class="menu-card-overlay">
            <div class="score-badge" id="chapter-score-5">0</div>
            <div class="card-title-text">ГЛАВА V</div>
            <div class="card-subtitle">ДЕСЯТИЧНІ ДРОБИ (1.3)</div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetScores()">Скинути прогрес</button>
</div>

<div id="screen-acts" class="screen">
    <div class="act-header-row">
        <div class="back-btn" onclick="goToScreen('screen-chapters')">←</div>
        <div class="act-current-title" id="chapter-title-display">ГЛАВА I</div>
    </div>

    <div class="menu-card border-green" onclick="openAct(1)">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="1">
        <div class="menu-card-overlay">
            <div class="score-badge" id="act-score-1">0</div>
            <div class="card-title-text">РІВЕНЬ 1</div>
            <div class="card-subtitle">Легкі числа</div>
        </div>
    </div>

    <div class="menu-card border-yellow" onclick="openAct(2)">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80" alt="2">
        <div class="menu-card-overlay">
            <div class="score-badge" id="act-score-2">0</div>
            <div class="card-title-text">РІВЕНЬ 2</div>
            <div class="card-subtitle">Середні числа</div>
        </div>
    </div>

    <div class="menu-card border-red" onclick="openAct(3)">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="3">
        <div class="menu-card-overlay">
            <div class="score-badge" id="act-score-3">0</div>
            <div class="card-title-text">РІВЕНЬ 3</div>
            <div class="card-subtitle">Складніші числа</div>
        </div>
    </div>
</div>

<div id="screen-act-detail" class="screen">
    <div class="act-header-row">
        <div class="back-btn" onclick="goToScreen('screen-acts')">←</div>
        <div class="act-current-title" id="act-title-display">ГЛАВА IV - РІВЕНЬ 1</div>
        <div class="streak-badge" id="streak-display">🔥 0</div>
    </div>

    <div class="formula-box" id="act-formula">...</div>
    <div class="answers-grid" id="act-answers"></div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('neon-theme');
    }

    // --- СИСТЕМА XP И УРОВНЕЙ ---
    let userXP = parseInt(localStorage.getItem('userXP_v3') || '0');
    let questionStartTime = 0;
    
    function addXP(amount) {
        userXP = Math.max(0, userXP + amount);
        localStorage.setItem('userXP_v3', userXP.toString());
        updateXPDisplay();
    }

    function updateXPDisplay() {
        const level = Math.floor(userXP / 100) + 1;
        const currentProgress = userXP % 100;
        document.getElementById('level-display').textContent = `LVL ${level} (${userXP} XP)`;
        document.getElementById('xp-fill').style.width = `${currentProgress}%`;
    }

    // --- ЗВУКОВЫЕ ЭФФЕКТЫ ---
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-toggle-btn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
        if (!soundEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);

            if (navigator.vibrate) navigator.vibrate(50);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);

            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        }
    }

    // --- ФОНОВЫЕ ЧАСТИЦЫ ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const colors = ['rgba(168, 85, 247, ', 'rgba(6, 182, 212, ', 'rgba(16, 185, 129, '];

    for (let i = 0; i < 25; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            colorPrefix: colors[Math.floor(Math.random() * colors.length)],
            alpha: Math.random() * 0.4 + 0.2
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.colorPrefix}${p.alpha})`;
            ctx.fill();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- ЭФФЕКТ КОНФЕТТИ ---
    const cCanvas = document.getElementById('confetti-canvas');
    const cCtx = cCanvas.getContext('2d');
    let confettiList = [];

    function triggerConfetti() {
        cCanvas.width = window.innerWidth;
        cCanvas.height = window.innerHeight;
        confettiList = [];
        const confColors = ['#10b981', '#f59e0b', '#a855f7', '#06b6d4', '#ef4444'];
        
        for (let i = 0; i < 60; i++) {
            confettiList.push({
                x: cCanvas.width / 2,
                y: cCanvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.8) * 12,
                size: Math.random() * 6 + 4,
                color: confColors[Math.floor(Math.random() * confColors.length)],
                life: 1
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
        let active = false;

        confettiList.forEach(p => {
            if (p.life > 0) {
                active = true;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life -= 0.025;

                cCtx.fillStyle = p.color;
                cCtx.globalAlpha = Math.max(0, p.life);
                cCtx.fillRect(p.x, p.y, p.size, p.size);
            }
        });

        if (active) requestAnimationFrame(animateConfetti);
        else cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
    }

    // --- ДЕМО ДАННЫЕ ---
    const demoData = {
        1: { formula: "X - 5 = 12", cards: [{ lines: ["X = 12 - 5", "X = 7"], isCorrect: false }, { lines: ["X = 12 + 5", "X = 17"], isCorrect: true }, { lines: ["X = 12 • 5", "X = 60"], isCorrect: false }, { lines: ["X = 12 : 5", "X = 2.4"], isCorrect: false }] },
        2: { formula: "X • 2 + 3 = 11", cards: [{ lines: ["X • 2 = 11 + 3", "X • 2 = 14", "X = 7"], isCorrect: false }, { lines: ["X • 2 = 11 - 3", "X • 2 = 8", "X = 8 : 2 = 4"], isCorrect: true }, { lines: ["X • 2 = 8", "X = 8 • 2", "X = 16"], isCorrect: false }, { lines: ["X • 2 = 11", "X = 11 - 2", "X = 9"], isCorrect: false }] },
        3: { formula: "2X • 3 + 4 = 22", cards: [{ lines: ["2X • 3 = 22 - 4", "2X = 18 : 3", "X = 6 : 2 = 3"], isCorrect: true }, { lines: ["2X • 3 = 22 + 4", "2X = 26 : 3", "X = 8.6"], isCorrect: false }, { lines: ["2X = 18 • 3", "2X = 54", "X = 27"], isCorrect: false }, { lines: ["2X = 18 - 3", "2X = 15", "X = 7.5"], isCorrect: false }] },
        4: { formula: "2(3X + 4) - 5 = 27", cards: [{ lines: ["1) 2(3X + 4) = 27 + 5", "2) 3X + 4 = 32 : 2", "3) 3X = 16 - 4", "4) X = 12 : 3 = 4"], isCorrect: true }, { lines: ["1) 2(3X + 4) = 27 - 5", "2) 3X + 4 = 22 : 2", "3) X = (11 - 4) : 3 = 2.3"], isCorrect: false }, { lines: ["1) 2(3X + 4) = 32", "2) 3X + 4 = 16", "3) X = (16 + 4) : 3 = 6.6"], isCorrect: false }, { lines: ["1) 3X + 4 = 32 : 2", "2) 3X = 16 + 4", "3) X = 20 : 3 = 6.6"], isCorrect: false }] },
        5: { formula: "1.2(2X + 0.5) - 0.4 = 5.6", cards: [{ lines: ["1) 1.2(2X + 0.5) = 5.6 + 0.4", "2) 2X + 0.5 = 6 : 1.2", "3) 2X = 5 - 0.5", "4) X = 4.5 : 2 = 2.25"], isCorrect: true }, { lines: ["1) 1.2(2X + 0.5) = 5.6 - 0.4", "2) 2X + 0.5 = 5.2 : 1.2", "3) X = 1.8"], isCorrect: false }, { lines: ["1) 1.2(2X + 0.5) = 6", "2) 2X + 0.5 = 5", "3) 2X = 5 + 0.5", "4) X = 2.75"], isCorrect: false }, { lines: ["1) 2X + 0.5 = 6 - 1.2", "2) 2X = 4.8 - 0.5", "3) X = 2.15"], isCorrect: false }] }
    };

    function switchDemoChapter(chNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === chNum);
        });

        const data = demoData[chNum];
        document.getElementById('demo-formula').textContent = data.formula;

        const grid = document.getElementById('demo-answers-grid');
        grid.innerHTML = '';

        data.cards.forEach(c => {
            const card = document.createElement('div');
            card.className = `answer-card ${c.isCorrect ? 'correct' : ''}`;
            c.lines.forEach(l => {
                const lineDiv = document.createElement('div');
                lineDiv.textContent = l;
                card.appendChild(lineDiv);
            });
            grid.appendChild(card);
        });
    }

    switchDemoChapter(5);

    let currentChapter = 1;
    let currentAct = 1; 

    function goToScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    let currentCorrectIndex = -1;
    let streakCount = 0;
    let toastTimeout;
    let gameScores = {};
    let isAnsweringBlocked = false;

    function loadScores() {
        const savedScores = localStorage.getItem('gameScores_v21');
        if (savedScores) {
            try { gameScores = JSON.parse(savedScores); } catch (e) { gameScores = {}; }
        }
        updateXPDisplay();
        updateScoreDisplays();
    }

    function saveScores() {
        localStorage.setItem('gameScores_v21', JSON.stringify(gameScores));
    }

    function updateScoreDisplays() {
        for (let ch = 1; ch <= 5; ch++) {
            let totalCorrect = 0;
            let totalWrong = 0;

            for (let act = 1; act <= 3; act++) {
                const data = gameScores[`${ch}_${act}`] || { correct: 0, wrong: 0 };
                totalCorrect += data.correct || 0;
                totalWrong += data.wrong || 0;
            }

            const chElem = document.getElementById(`chapter-score-${ch}`);
            if (chElem) {
                if (totalCorrect > 0 || totalWrong > 0) {
                    chElem.innerHTML = `<span style="color:#34d399">✅ ${totalCorrect}</span> <span style="color:#f87171; margin-left:6px;">❌ ${totalWrong}</span>`;
                    chElem.style.display = 'block';
                } else {
                    chElem.style.display = 'none';
                }
            }
        }

        for (let act = 1; act <= 3; act++) {
            const data = gameScores[`${currentChapter}_${act}`] || { correct: 0, wrong: 0 };
            const actElem = document.getElementById(`act-score-${act}`);
            if (actElem) {
                if ((data.correct || 0) > 0 || (data.wrong || 0) > 0) {
                    actElem.innerHTML = `<span style="color:#34d399">✅ ${data.correct || 0}</span> <span style="color:#f87171; margin-left:6px;">❌ ${data.wrong || 0}</span>`;
                    actElem.style.display = 'block';
                } else {
                    actElem.style.display = 'none';
                }
            }
        }
    }

    function resetScores() {
        if (confirm('Скинути весь прогрес, XP та статистику?')) {
            gameScores = {};
            streakCount = 0;
            userXP = 0;
            localStorage.removeItem('userXP_v3');
            updateXPDisplay();
            saveScores();
            updateScoreDisplays();
            showToast('Прогрес скинуто!');
        }
    }

    function showToast(text, type = 'normal') {
        const toast = document.getElementById('toast-notification');
        toast.textContent = text;
        toast.className = 'notification show ' + type;

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    function openChapter(chNum) {
        currentChapter = chNum;
        const romanCh = ["I", "II", "III", "IV", "V"][currentChapter - 1];
        document.getElementById('chapter-title-display').textContent = `ГЛАВА ${romanCh}`;
        updateScoreDisplays();
        goToScreen('screen-acts');
    }

    function openAct(actNum) {
        currentAct = actNum;
        streakCount = 0;
        updateStreakDisplay();
        const romanCh = ["I", "II", "III", "IV", "V"][currentChapter - 1];
        document.getElementById('act-title-display').textContent = `ГЛАВА ${romanCh} - РІВЕНЬ ${currentAct}`;
        generateTask();
        goToScreen('screen-act-detail');
    }

    function updateStreakDisplay() {
        const streakElem = document.getElementById('streak-display');
        if (streakCount > 1) {
            streakElem.textContent = `🔥 Стрик: ${streakCount}`;
            streakElem.style.display = 'block';
        } else {
            streakElem.style.display = 'none';
        }
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateTask() {
        isAnsweringBlocked = false;
        questionStartTime = Date.now();
        if (currentChapter === 1) generateChapter1();
        else if (currentChapter === 2) generateChapter2();
        else if (currentChapter === 3) generateChapter3();
        else if (currentChapter === 4) generateChapter4();
        else generateChapter5();
    }

    function generateChapter1() {
        let maxLimit = currentAct === 1 ? 10 : (currentAct === 2 ? 20 : 50);
        let a = getRandomInt(1, Math.floor(maxLimit / 2));
        let b = getRandomInt(1, maxLimit - a);
        let xVal = a + b;

        let formulaStr = `X - ${a} = ${b}`;
        let cards = [
            { lines: [`X = ${b} + ${a}`, `X = ${xVal}`], isCorrect: true },
            { lines: [`X = ${b} - ${a}`, `X = ${Math.abs(b - a) || 1}`], isCorrect: false },
            { lines: [`X = ${b + 2} + ${a}`, `X = ${xVal + 2}`], isCorrect: false },
            { lines: [`X = ${b + 5} - ${a}`, `X = ${xVal + 5}`], isCorrect: false }
        ];
        renderCards(formulaStr, cards);
    }

    function generateChapter2() {
        let maxLimit = currentAct === 1 ? 10 : (currentAct === 2 ? 20 : 50);
        let mult = getRandomInt(2, 4);
        let xVal = getRandomInt(2, Math.floor(maxLimit / mult) || 2);
        let b = getRandomInt(1, 10);
        let total = xVal * mult + b;
        let step1 = total - b;

        let formulaStr = `X • ${mult} + ${b} = ${total}`;
        let cards = [
            { lines: [`X • ${mult} = ${total} - ${b}`, `X • ${mult} = ${step1}`, `X = ${step1} : ${mult}`, `X = ${xVal}`], isCorrect: true },
            { lines: [`X • ${mult} = ${total} - ${b}`, `X • ${mult} = ${step1}`, `X = ${step1} + ${mult}`, `X = ${step1 + mult}`], isCorrect: false },
            { lines: [`X • ${mult} = ${total} - ${b + 2}`, `X • ${mult} = ${step1 - 2}`, `X = ${Math.floor((step1 - 2)/mult) || 1}`], isCorrect: false },
            { lines: [`X • ${mult} = ${total} + ${b}`, `X • ${mult} = ${total + b}`, `X = ${Math.floor((total + b) / mult)}`], isCorrect: false }
        ];
        renderCards(formulaStr, cards);
    }

    function generateChapter3() {
        let coef = getRandomInt(2, 3);
        let mult = getRandomInt(2, 3);
        let xVal = getRandomInt(2, currentAct === 1 ? 4 : (currentAct === 2 ? 8 : 12));
        let b = getRandomInt(2, 10);
        
        let total = (coef * xVal) * mult + b;
        let step1 = total - b;
        let step2 = step1 / mult;

        let formulaStr = `${coef}X • ${mult} + ${b} = ${total}`;
        let cards = [
            { lines: [`${coef}X • ${mult} = ${total} - ${b}`, `${coef}X = ${step1} : ${mult}`, `X = ${step2} : ${coef}`, `X = ${xVal}`], isCorrect: true },
            { lines: [`${coef}X • ${mult} = ${total} - ${b}`, `${coef}X = ${step1} : ${mult}`, `X = ${step2} - ${coef}`, `X = ${Math.abs(step2 - coef) || 1}`], isCorrect: false },
            { lines: [`${coef}X • ${mult} = ${total} - ${b}`, `${coef}X = ${step1} + ${mult}`, `X = ${Math.floor((step1 + mult)/coef)}`], isCorrect: false },
            { lines: [`${coef}X • ${mult} = ${total} + ${b}`, `${coef}X = ${total + b} : ${mult}`, `X = ${Math.floor((total + b) / (mult * coef)) || 1}`], isCorrect: false }
        ];
        renderCards(formulaStr, cards);
    }

    function generateChapter4() {
        let B = getRandomInt(2, 3);
        let C = getRandomInt(2, 5);
        let A = getRandomInt(2, 3);
        let D = getRandomInt(2, 8);

        let maxLimit = currentAct === 1 ? 4 : (currentAct === 2 ? 7 : 10);
        let xVal = getRandomInt(3, maxLimit);

        let insideVal = B * xVal + C;
        let multVal = A * insideVal;
        let total = multVal - D;

        let step1 = total + D;
        let step2 = step1 / A;
        let step3 = step2 - C;

        let formulaStr = `${A}(${B}X + ${C}) - ${D} = ${total}`;

        let cards = [
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${step1} : ${A}`, 
                    `3) ${B}X = ${step2} - ${C}`, 
                    `4) X = ${step3} : ${B} = ${xVal}`
                ], 
                isCorrect: true 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} - ${D}`, 
                    `2) ${B}X + ${C} = ${Math.abs(total - D)} : ${A}`, 
                    `3) X = ${Math.floor(Math.abs(total - D) / (A * B)) || 1}`
                ], 
                isCorrect: false 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${step1} : ${A}`, 
                    `3) ${B}X = ${step2} + ${C}`, 
                    `4) X = ${step2 + C} : ${B} = ${Math.floor((step2 + C) / B)}`
                ], 
                isCorrect: false 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${step1} - ${A}`, 
                    `3) ${B}X = ${step1 - A - C}`, 
                    `4) X = ${Math.floor((step1 - A - C) / B) || 2}`
                ], 
                isCorrect: false 
            }
        ];

        renderCards(formulaStr, cards);
    }

    // --- ГЛАВА V (ДЕСЯТИЧНЫЕ ДРОБИ) ---
    function generateChapter5() {
        let decimals = [0.2, 0.4, 0.5, 0.6, 0.8, 1.2, 1.5, 2.5];
        let A = decimals[getRandomInt(0, decimals.length - 1)];
        let B = getRandomInt(1, 3);
        let C = (getRandomInt(1, 8) * 0.5); 
        let D = (getRandomInt(1, 10) * 0.2); 
        let xVal = (getRandomInt(1, 6) * 0.5);

        // Округления для точного вычисления без мусора в floating point
        A = parseFloat(A.toFixed(2));
        C = parseFloat(C.toFixed(2));
        D = parseFloat(D.toFixed(2));
        xVal = parseFloat(xVal.toFixed(2));

        let insideVal = B * xVal + C;
        let multVal = A * insideVal;
        let total = parseFloat((multVal - D).toFixed(2));

        let step1 = parseFloat((total + D).toFixed(2));
        let step2 = parseFloat((step1 / A).toFixed(2));
        let step3 = parseFloat((step2 - C).toFixed(2));

        let formulaStr = `${A}(${B}X + ${C}) - ${D} = ${total}`;

        let cards = [
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${step1} : ${A}`, 
                    `3) ${B}X = ${step2} - ${C}`, 
                    `4) X = ${step3} : ${B} = ${xVal}`
                ], 
                isCorrect: true 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} - ${D}`, 
                    `2) ${B}X + ${C} = ${parseFloat((total - D).toFixed(2))} : ${A}`, 
                    `3) X = ${parseFloat((Math.abs(total - D) / (A * B)).toFixed(2))}`
                ], 
                isCorrect: false 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${step1} : ${A}`, 
                    `3) ${B}X = ${step2} + ${C}`, 
                    `4) X = ${parseFloat(((step2 + C) / B).toFixed(2))}`
                ], 
                isCorrect: false 
            },
            { 
                lines: [
                    `1) ${A}(${B}X + ${C}) = ${total} + ${D}`, 
                    `2) ${B}X + ${C} = ${parseFloat((step1 - A).toFixed(2))}`, 
                    `3) ${B}X = ${parseFloat((step1 - A - C).toFixed(2))}`, 
                    `4) X = ${parseFloat((Math.abs(step1 - A - C) / B).toFixed(2))}`
                ], 
                isCorrect: false 
            }
        ];

        renderCards(formulaStr, cards);
    }

    function renderCards(formulaStr, cards) {
        document.getElementById('act-formula').textContent = formulaStr;

        cards.sort(() => Math.random() - 0.5);
        currentCorrectIndex = cards.findIndex(c => c.isCorrect);

        const answersGrid = document.getElementById('act-answers');
        answersGrid.innerHTML = '';

        cards.forEach((cardData, idx) => {
            const card = document.createElement('div');
            card.className = 'answer-card';
            card.onclick = () => selectAndCheckAnswer(idx, card);

            cardData.lines.forEach(lineText => {
                const lineDiv = document.createElement('div');
                lineDiv.textContent = lineText;
                card.appendChild(lineDiv);
            });

            answersGrid.appendChild(card);
        });
    }

    function selectAndCheckAnswer(index, cardElem) {
        if (isAnsweringBlocked) return;
        isAnsweringBlocked = true;

        const allCards = document.querySelectorAll('#act-answers .answer-card');
        allCards.forEach(c => c.classList.add('disabled'));

        const key = `${currentChapter}_${currentAct}`;
        if (!gameScores[key]) gameScores[key] = { correct: 0, wrong: 0 };

        if (index === currentCorrectIndex) {
            cardElem.classList.add('correct');
            playSound('correct');

            const timeTaken = (Date.now() - questionStartTime) / 1000;
            let earnedXP = 25;
            let isFast = false;

            if (timeTaken < 5) {
                earnedXP += 15;
                isFast = true;
            }

            addXP(earnedXP);
            streakCount++;
            updateStreakDisplay();

            if (streakCount % 5 === 0) {
                triggerConfetti();
                showToast(`🔥 МЕГА СТРИК: ${streakCount}!`, 'success');
            } else if (isFast) {
                showToast(`⚡ ШВИДКА ВІДПОВІДЬ! +${earnedXP} XP`, 'success');
            } else {
                showToast(`ПРАВИЛЬНО! +${earnedXP} XP`, 'success');
            }

            gameScores[key].correct = (gameScores[key].correct || 0) + 1;
            saveScores();
            updateScoreDisplays();
            setTimeout(() => generateTask(), 600);
        } else {
            cardElem.classList.add('wrong');
            
            if (allCards[currentCorrectIndex]) {
                allCards[currentCorrectIndex].classList.add('correct');
            }

            playSound('wrong');
            streakCount = 0;
            updateStreakDisplay();
            
            addXP(-10);
            showToast('НЕПРАВИЛЬНО! -10 XP', 'error');

            gameScores[key].wrong = (gameScores[key].wrong || 0) + 1;
            saveScores();
            updateScoreDisplays();

            setTimeout(() => generateTask(), 1500);
        }
    }

    loadScores();
</script>
